[package]
name = "herald"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2"
dotenv = "0.15.0"
rocket = { version = "0.5.1", features = ["json", "tls", "uuid"] }
rocket_db_pools = { version = "0.2.0", features = ["sqlx_mysql"] }
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.7.4", default-features = false, features = ["time", "uuid", "macros"] }
time = { version = "0.3.47", features = ["serde", "serde-human-readable"] }
uuid = { version = "1.21.0", features = ["serde"] }
handlebars = "6"

[dev-dependencies]
reqwest = { version = "0.13.2", features = ["blocking"] }
testcontainers = { version = "0.27.2", features = ["blocking"] }
